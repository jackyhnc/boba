services:
  postgres:
    image: postgres:16-alpine
    container_name: boba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boba
      POSTGRES_PASSWORD: boba
      POSTGRES_DB: boba
    ports:
      - "5432:5432"
    volumes:
      - boba-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boba -d boba"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  boba-postgres-data:
