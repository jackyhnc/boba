# Render Blueprint — deploys Boba + Postgres in one repo-linked stack.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render, "New +" → "Blueprint" → connect this repo.
#   3. Fill in the prompted env values (see USER_TODO.md): TWILIO_*, ADMIN_TOKEN, etc.
#   4. Apply. Render builds via Dockerfile and runs migrations on every deploy.
#
# The free Postgres plan is fine for closed beta. Upgrade to "starter"
# before launch — free plans get suspended after 90 days of inactivity.

databases:
  - name: boba-postgres
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: boba-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info

      - key: DATABASE_URL
        fromDatabase:
          name: boba-postgres
          property: connectionString

      # Twilio — fill in via the Render dashboard, not committed.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_DRY_RUN
        value: "false"
      - key: TWILIO_REQUIRE_SIGNATURE
        value: "true"
      - key: PUBLIC_WEBHOOK_BASE_URL
        sync: false

      - key: INVITES_REQUIRED
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true

      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_CRON
        value: "0 21 * * *"

      - key: AI_SEEDING_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
